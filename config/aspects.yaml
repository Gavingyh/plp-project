# Frozen aspect taxonomy — MVP plan Phase 3.
#
# STATUS: seeded from the proposal's a-priori aspects, NOT yet validated
# against real cluster centroids. `python -m aspects.discover` HAS been run
# on the live corpus (2,888 sentences, 2026-09-06) and found 9 real clusters
# (52% noise) — but they do NOT cleanly correspond to these 4 aspects. They
# split along a coarser axis instead:
#   - "consumer banking service" (accounts, transfers, scam calls, cashback/
#     rewards cards, RM relationships) — the majority of Reddit content
#   - "investment/stock discussion" (dividend yields, analyst price targets,
#     buying decisions, stock performance vs. benchmarks) — a real cluster,
#     but it doesn't further subdivide into asset_quality vs. NIM vs.
#     management_guidance the way this file assumes.
# This is expected, not a bug: r/singaporefi is personal-finance-oriented,
# not equity-analyst-oriented, so granular analyst-style aspects are sparse
# in Reddit chat. They should show up once earnings-release text is ingested
# (`python -m ingest.earnings` — still pending a human downloading the PDFs,
# see MVP plan Phase 1b) — that's where NIM/asset-quality/guidance language
# actually lives. Until then, treat aspect-level breakdowns from this seeded
# taxonomy as provisional (assign.py's floor is currently too permissive —
# most sentences match ~4 of 5 aspects near-equally, see docs/data-viability.md).
#
# DECISION NEEDED (flagged in the plan's "Open decisions"): once earnings
# text is in, re-run discover.py and decide whether to (a) keep these 4
# proposal aspects and accept that Reddit mostly won't populate them, letting
# earnings/news carry that signal, or (b) add "service_quality" /
# "stock_valuation" as additional data-driven aspects alongside them. This
# needs a team/mentor call, not a silent pipeline change.
#
# Each aspect's `seed_terms` bootstrap its centroid embedding (mean of
# FinBERT embeddings of the seed phrases) until real cluster centroids from
# discover.py replace them.

aspects:
  dividend_policy:
    label: "Dividend Policy"
    seed_terms:
      - "dividend payout ratio"
      - "special dividend"
      - "dividend yield"
      - "capital return to shareholders"
      - "share buyback"

  asset_quality:
    label: "Asset Quality / Provisioning"
    seed_terms:
      - "non-performing loans"
      - "credit provisions"
      - "asset quality"
      - "loan loss allowance"
      - "NPL ratio"

  net_interest_margin:
    label: "Net Interest Margin"
    seed_terms:
      - "net interest margin"
      - "interest rate spread"
      - "NIM compression"
      - "funding costs"
      - "loan growth"

  management_guidance:
    label: "Management Guidance"
    seed_terms:
      - "management guidance"
      - "full year outlook"
      - "CEO commentary"
      - "forward guidance"
      - "strategic priorities"

  other:
    label: "Other"
    seed_terms:
      - "banking services"
      - "customer experience"
      - "digital banking"

# Sentences whose best cosine similarity to any non-OTHER centroid falls
# below this threshold are assigned to "other" rather than forced into the
# nearest-but-still-distant aspect.
similarity_floor: 0.35
