# Frozen aspect taxonomy.
#
# STATUS: seeded from the proposal's a-priori aspects, NOT yet validated
# against real cluster centroids.
#
# UPDATED 2026-09-11: discovery has been re-run on the full corpus (36,884
# sentences) and the picture below has changed in one important way. With
# earnings text present, genuine analyst-style clusters DO emerge — leverage
# ratio, Basel III / CET-1, fee income by line, return on equity — which the
# Reddit-only corpus could never produce. What has NOT changed is that they
# do not correspond to these four aspects: the run yields 281 clusters with a
# median size of 23 and 67% noise, finer than these labels and cutting across
# them. Separately, these four centroids are the least distinct of three
# candidates measured (0.1125 mean pairwise cosine distance vs 0.1695 and
# 0.2222), and that is a property of the seed terms which no threshold change
# can fix. See docs/evidence/aspect-discovery-2026-09-11.md and
# docs/evidence/taxonomy-comparison-2026-09-11.md. The DECISION NEEDED below
# still stands and is now better evidenced.
#
# The original 2026-09-06 finding, on 2,888 Reddit-only sentences, follows.
# `python -m aspects.discover` found 9 real clusters
# (52% noise) — but they do NOT cleanly correspond to these 4 aspects. They
# split along a coarser axis instead:
#   - "consumer banking service" (accounts, transfers, scam calls, cashback/
#     rewards cards, RM relationships) — the majority of Reddit content
#   - "investment/stock discussion" (dividend yields, analyst price targets,
#     buying decisions, stock performance vs. benchmarks) — a real cluster,
#     but it doesn't further subdivide into asset_quality vs. NIM vs.
#     management_guidance the way this file assumes.
# This is expected, not a bug: r/singaporefi is personal-finance-oriented,
# not equity-analyst-oriented, so granular analyst-style aspects are sparse
# in Reddit chat. They should show up once earnings-release text is ingested
# (`python -m ingest.earnings` — still pending a human downloading the PDFs,
# see ingest/earnings_fetch.py) — that's where NIM/asset-quality/guidance language
# actually lives. Until then, treat aspect-level breakdowns from this seeded
# taxonomy as provisional (assign.py's floor is currently too permissive —
# most sentences match ~4 of 5 aspects near-equally, see docs/data-viability.md).
#
# DECISION NEEDED (flagged in the plan's "Open decisions"): once earnings
# text is in, re-run discover.py and decide whether to (a) keep these 4
# proposal aspects and accept that Reddit mostly won't populate them, letting
# earnings/news carry that signal, or (b) add "service_quality" /
# "stock_valuation" as additional data-driven aspects alongside them. This
# needs a team/mentor call, not a silent pipeline change.
#
# Each aspect's `seed_terms` bootstrap its centroid embedding (mean of
# FinBERT embeddings of the seed phrases) until real cluster centroids from
# discover.py replace them.

aspects:
  dividend_policy:
    label: "Dividend Policy"
    seed_terms:
      - "dividend payout ratio"
      - "special dividend"
      - "dividend yield"
      - "capital return to shareholders"
      - "share buyback"

  asset_quality:
    label: "Asset Quality / Provisioning"
    seed_terms:
      - "non-performing loans"
      - "credit provisions"
      - "asset quality"
      - "loan loss allowance"
      - "NPL ratio"

  net_interest_margin:
    label: "Net Interest Margin"
    seed_terms:
      - "net interest margin"
      - "interest rate spread"
      - "NIM compression"
      - "funding costs"
      - "loan growth"

  management_guidance:
    label: "Management Guidance"
    seed_terms:
      - "management guidance"
      - "full year outlook"
      - "CEO commentary"
      - "forward guidance"
      - "strategic priorities"

  other:
    label: "Other"
    seed_terms:
      - "banking services"
      - "customer experience"
      - "digital banking"

# Sentences whose best cosine similarity to any non-OTHER centroid falls
# below this threshold are assigned to "other" rather than forced into the
# nearest-but-still-distant aspect.
#
# RECALIBRATED 2026-09-06 from 0.35 -> 0.65, backed by a live sweep
# (aspects/compare_taxonomies.py), not guessed. At 0.35, even a 2-aspect
# coarse candidate matched BOTH aspects on ~100% of sentences (avg 2.00/2) —
# meaning 0.35 wasn't discriminating between anything, for any taxonomy.
# The sweep: floor 0.35->2.00 avg matched/0.1% other; 0.50->1.96/0.6%;
# 0.60->1.89/2.8%; 0.70->1.63/9.2%; 0.75->1.29/18.9%. 0.65 is a starting
# recalibration between those points, not a final answer — re-sweep whenever
# the corpus grows materially (earnings text added, full backfill in) or the
# taxonomy changes, since the right floor depends on both.
# NOTE: this is a pure calibration fix (how confidently something must match
# before counting), independent of the taxonomy-content decision above —
# safe to apply without the same sign-off, since it changes threshold, not
# meaning.
similarity_floor: 0.65
