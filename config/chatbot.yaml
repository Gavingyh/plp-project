# The chatbot's settings (read by chatbot/settings.py, 4 Oct 2026). Each has a
# default `value`; where `env` names an environment variable, a value set
# there (in .env or the shell) wins. Edit defaults here, not in the code.

backend:          {value: "ollama", env: CHATBOT_BACKEND}   # ollama (decided 4 Oct) | claude | openai | gemini | auto: the first API key set
temperature:      {value: 0.2, env: CHATBOT_TEMPERATURE}    # low, for grounded answers
ollama_url:       {value: "http://localhost:11434", env: OLLAMA_BASE_URL}
openai_base_url:  {value: "https://api.openai.com/v1", env: OPENAI_BASE_URL}   # any OpenAI-compatible provider
ollama_think:     {value: null, env: OLLAMA_THINK}          # false turns a reasoning model's thinking off (qwen3)

models:
  ollama:  {value: "llama3.1:8b", env: OLLAMA_MODEL}     # the demo model (decided 4 Oct)
  claude:  {value: "claude-sonnet-5", env: CLAUDE_MODEL}
  openai:  {value: "gpt-4o-mini", env: OPENAI_MODEL}
  gemini:  {value: "gemini-3.8-flash", env: [GEMINI_MODEL, GEMINI_CHAT_MODEL]}
  intent:  {value: "llama3.1:8b", env: CHATBOT_INTENT_MODEL}   # the intent classifier (chatbot/intent.py)
  judge:   {value: "qwen3:4b", env: CHATBOT_JUDGE_MODEL}       # the evaluation's answer checker (chatbot/judge.py)

intent_think: {value: null, env: CHATBOT_INTENT_THINK}

# Limits and waits, the same for every backend unless named.
max_tool_iterations: {value: 8}          # a confused tool loop stops here
max_output_tokens:   {value: 1024}       # the Claude API requires a cap
timeouts_seconds:
  ollama: {value: 120}                   # local generation can be slow on a CPU
  hosted: {value: 60}
  intent: {value: 60}
  judge:  {value: 300}
retry_waits_seconds:                     # before each retry on 429 / 503
  gemini: {value: [2, 5, 15]}
  openai: {value: [5, 15, 30, 60]}       # unless Retry-After says otherwise
max_retry_after_seconds: {value: 60}

# Requests the chatbot may send to a hosted provider (chatbot/ratelimit.py).
# Set BELOW what the free tiers publish (awesome-free-llm-apis, read 6 Oct 2026:
# Groq 30 requests a minute and 1,000 a day; Gemini 15 a minute and up to 1,500 a
# day depending on the model), because a run that hits a limit loses more than
# it saves and some tiers also limit tokens. The daily figure is a rolling 24 hours.
# tpm is a tokens-per-minute cap, used where a provider has one. Groq's free tier
# has one; its exact figure was not checked, so 6,000 is a cautious guess: the
# pacer also believes Groq's own remaining-token headers over this number.
# Raise a figure only after reading your key's limits in the provider's console.
rate_limits:
  groq:
    rpm: {value: 20,   env: GROQ_RPM}
    rpd: {value: 700,  env: GROQ_RPD}
    tpm: {value: 6000, env: GROQ_TPM}
  gemini:
    rpm: {value: 8,    env: GEMINI_RPM}
    rpd: {value: 200,  env: GEMINI_RPD}
    tpm: {value: null, env: GEMINI_TPM}

# Conversation and evidence.
history:
  turns:        {value: 3}               # earlier question/answer pairs passed to the model
  answer_chars: {value: 1200}            # earlier answers are trimmed to this
harness_search:
  k_one_bank:   {value: 3}               # quotes the harness adds when one bank was asked about
  k_each_bank:  {value: 1}               # ... per bank when several were
enforce_evidence: {value: "strip", env: CHATBOT_ENFORCE_EVIDENCE} # off | strip | search (strip decided 4 Oct)
aspect_query:     {value: true, env: CHATBOT_ASPECT_QUERY}        # rank evidence by the aspect's name (on since 4 Oct)
trace_file:       {value: null, env: CHATBOT_TRACE_FILE}

# The trend tool.
trend:
  stable_within:  {value: 0.02}          # an unshrunk 7d-vs-30d (or month-on-month) change this small reads "stable"
  monthly_points: {value: 12}            # months of series the trend tool returns (the API too)
  chat_months:    {value: 6}             # ... of which the chatbot's model is given, when the 7d/30d comparison is too thin

# What the chatbot's model is given to read a score by (chatbot/tools.py, 4 Oct).
# Scores run from -1 (every sentence negative) to +1 (every sentence positive).
reading:
  neutral_below:    {value: 0.05}        # a score nearer 0 than this reads "neutral"
  slightly_below:   {value: 0.15}        # ... "slightly positive" or "slightly negative"
  moderately_below: {value: 0.35}        # ... "moderately"; from here on, "clearly"
topics_each_way:    {value: 2}           # strongest and weakest topics given with a bank's overall score

# Which retrieved sentences the chatbot's model sees (chatbot/tools.py, 4 Oct).
evidence:
  pool_factor:      {value: 10}          # rank k times this many candidates, then pick k
  max_per_source:   {value: 2}           # from one source, unless too few others match
  same_wording:     {value: 0.7}         # word overlap at which two sentences count as one wording
  polar_boost:      {value: 0.03}        # added to a positive or negative sentence's rank
