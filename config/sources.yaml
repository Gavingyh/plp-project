# Every source the pipeline stores sentences from (the `source` column).
#
# weight: how much one sentence from the source counts in the index
#   (aggregate/index.py), relative to a Reddit comment (1.0). A source not
#   listed here counts default_weight.
# personal_text: true when members of the public wrote the text.
# team_only: true when the text may not leave the team (CNA articles).
#   Text with either flag is never sent to the Gemini backend
#   (chatbot/backends/gemini_backend.py), whose free tier may be read by people.
#
# earnings was 3.0, dropped to 1.0 after the earnings corpus landed. The 3.0
# was set when earnings was assumed to be a handful of high-signal documents;
# it became the second-largest source (10,658 sentences), and it is
# management describing its own results, measurably far more positive than
# any other source: 24.7% of earnings sentences score positive against 2.3%
# of Reddit sentences. Triple-weighting self-authored promotional prose
# amplified a known skew instead of damping it; 1.0 counts it at face value
# without letting it dominate.

default_weight: 1.0

sources:
  arctic_shift: {weight: 1.0, personal_text: true,  team_only: false}   # Reddit posts and comments
  earnings:     {weight: 1.0, personal_text: false, team_only: false}   # the banks' own reports
  cna:          {weight: 1.5, personal_text: false, team_only: true}
  google_news:  {weight: 1.5, personal_text: false, team_only: false}
  yahoo_news:   {weight: 1.5, personal_text: false, team_only: false}
  newsapi:      {weight: 1.5, personal_text: false, team_only: false}
  alphavantage: {weight: 1.5, personal_text: false, team_only: false}
  sgx_research: {weight: 1.0, personal_text: false, team_only: true}   # broker research PDFs: third-party text
