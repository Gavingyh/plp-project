# Every source the pipeline stores sentences from (the `source` column).
#
# weight: how much one sentence from the source counts in the index
#   (aggregate/index.py), relative to a Reddit comment (1.0). A source not
#   listed here counts default_weight.
# personal_text: true when members of the public wrote the text.
# team_only: true when the text may not leave the team: never committed,
#   never shared (CNA articles, broker research).
# hosted_model: true when a hosted chatbot model may still receive a
#   team_only source's text. The team agreed this on 24 Oct 2026 for CNA and
#   broker research, so OpenAI's answers can quote them. Personal text
#   (Reddit) is never sent, whatever this says (chatbot/backends/base.py).
#
# earnings was 3.0, dropped to 1.0 after the earnings corpus landed. The 3.0
# was set when earnings was assumed to be a handful of high-signal documents;
# when the weight was changed it had become the second-largest source
# (10,658 sentences then, 12,254 now), and it is management describing its
# own results, far more positive than forum text: base FinBERT calls 42.8% of
# earnings sentences positive against 5.0% of Reddit sentences (24.7% and
# 2.3% at the time of the change). Triple-weighting self-authored promotional prose
# amplified a known skew instead of damping it; 1.0 counts it at face value
# without letting it dominate.

default_weight: 1.0

# label: what the chatbot calls the source when it cites a sentence (4 Oct 2026).
sources:
  arctic_shift: {weight: 1.0, personal_text: true,  team_only: false, label: "Reddit"}   # Reddit posts and comments
  earnings:     {weight: 1.0, personal_text: false, team_only: false, label: "bank results report"}   # the banks' own reports
  cna:          {weight: 1.5, personal_text: false, team_only: true,  hosted_model: true, label: "CNA"}
  google_news:  {weight: 1.5, personal_text: false, team_only: false, label: "news"}
  yahoo_news:   {weight: 1.5, personal_text: false, team_only: false, label: "news"}
  newsapi:      {weight: 1.5, personal_text: false, team_only: false, label: "news"}
  alphavantage: {weight: 1.5, personal_text: false, team_only: false, label: "news"}
  sgx_research: {weight: 1.0, personal_text: false, team_only: true,  hosted_model: true, label: "broker research"}   # broker research PDFs: third-party text
